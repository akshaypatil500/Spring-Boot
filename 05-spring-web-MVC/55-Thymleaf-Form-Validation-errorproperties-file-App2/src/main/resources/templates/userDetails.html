<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div>
        <h2 style="color: red;">User Information</h2>

        <h3 style="color: blue;">
            User Name: <span th:text="${a}"></span>
        </h3>

        <h3 style="color: blue;">
            User Email: <span th:text="${b}"></span>
        </h3>

        <h3 style="color: blue;">
            User Mobile: <span th:text="${c}"></span>
        </h3>

        <h3 style="color: blue;">
            User Gender: <span th:text="${d}"></span>
        </h3>

        <h3 style="color: blue;">
            User Birth Date: <span th:text="${e}"></span>
        </h3>

    </div>

</body>
</html>
